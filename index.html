<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What is John doing?</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="screen" id="start-screen">
  <h1>What is John doing?</h1>
  <p class="subtitle">Learn English phrasal verbs with John.</p>
  <div class="button-row">
    <button class="btn btn-primary" id="play-btn">Play</button>
    <button class="btn btn-secondary" id="practice-btn">Practice</button>
  </div>
</div>

<div class="screen hidden" id="topic-screen">
  <div class="topic-header">
    <button class="btn-back" id="topic-back-btn">← Back</button>
    <h2>Choose a topic</h2>
  </div>
  <div class="topic-list" id="topic-list"></div>
</div>

<div class="screen hidden" id="game-screen">
  <div class="top-bar">
    <span class="mode-label" id="mode-label" title="Choose topic"></span>
    <button class="btn btn-primary btn-small" id="check-btn">Check</button>
    <span class="score-label" id="score-label">Score: 0</span>
  </div>

  <div class="image-wrapper" id="image-wrapper">
    <img id="level-image" src="" alt="John">
    <div class="sentence" id="sentence"></div>
  </div>

  <div class="feedback" id="feedback"></div>
</div>

<div class="screen hidden" id="gameover-screen">
  <h1>Game Over</h1>
  <p class="result-text" id="result-text"></p>
  <div class="button-row">
    <button class="btn btn-primary" id="restart-btn">Play Again</button>
    <button class="btn btn-secondary" id="choose-topic-btn">Choose Topic</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
