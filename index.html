<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What is John doing?</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="screen" id="start-screen">
  <h1>What is John doing?</h1>
  <div class="mode-selector">
    <label class="radio-label">
      <input type="radio" name="mode" value="normal" checked>
      <span>Play</span>
    </label>
    <label class="radio-label">
      <input type="radio" name="mode" value="practice">
      <span>Practice</span>
    </label>
    <label class="radio-label">
      <input type="radio" name="mode" value="learn">
      <span>Learn</span>
    </label>
  </div>
  <p class="topic-hint">Choose a topic to start:</p>
  <div class="topic-list" id="topic-list"></div>
</div>

<div class="screen hidden" id="game-screen">
  <div class="top-bar">
    <button class="btn-menu" id="menu-btn">← Menu</button>
    <div class="stats-bar">
      <span id="progress-label">1/18</span>
      <span id="correct-label" class="stat-correct">✓ 0</span>
      <span id="wrong-label" class="stat-wrong">✗ 0</span>
    </div>
  </div>

  <div class="image-wrapper" id="image-wrapper">
    <img id="level-image" src="" alt="John">
    <div class="sentence" id="sentence"></div>
  </div>

  <div class="letter-panel" id="letter-panel"></div>

  <div class="feedback" id="feedback"></div>

  <div class="check-bar">
    <button class="btn btn-primary" id="check-btn">Check</button>
  </div>
</div>

<div class="screen hidden" id="gameover-screen">
  <h1>Statistics</h1>
  <div class="stats-summary" id="stats-summary"></div>
  <div id="wrong-words-section" class="hidden">
    <p class="wrong-words-title">Words to review:</p>
    <ul id="wrong-words-list"></ul>
  </div>
  <div class="button-row">
    <button class="btn btn-primary" id="restart-btn">Play Again</button>
    <button class="btn btn-secondary" id="menu-btn-gameover">Main Menu</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
